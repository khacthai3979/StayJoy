
services:
  # --- Next.js Dashboard ---
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s



  # --- Chatwoot ---
  chatwoot-web:
    image: chatwoot/chatwoot:latest
    ports:
      - "3001:3000"
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY:-replace_with_random_64_char_string}
      - FRONTEND_URL=https://chat.stayjoy.io.vn
      - DATABASE_URL=postgres://chatwoot:chatwoot@chatwoot-postgres:5432/chatwoot_production
      - REDIS_URL=redis://redis:6379
      - RAILS_LOG_TO_STDOUT=true
      - FB_APP_ID=26218463624451186
      - FB_APP_SECRET=ae962566e0b2ca743e48341db0ab7154
      - FB_VERIFY_TOKEN=StayJoyVerify2026
      - IG_VERIFY_TOKEN=StayJoyVerify2026
    depends_on:
      - chatwoot-postgres
      - redis
    entrypoint: ["/bin/sh", "-c"]
    command: ["bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0"]
    restart: unless-stopped

  chatwoot-worker:
    image: chatwoot/chatwoot:latest
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY:-replace_with_random_64_char_string}
      - FRONTEND_URL=https://chat.stayjoy.io.vn
      - DATABASE_URL=postgres://chatwoot:chatwoot@chatwoot-postgres:5432/chatwoot_production
      - REDIS_URL=redis://redis:6379
      - RAILS_LOG_TO_STDOUT=true
      - FB_APP_ID=26218463624451186
      - FB_APP_SECRET=ae962566e0b2ca743e48341db0ab7154
      - FB_VERIFY_TOKEN=StayJoyVerify2026
      - IG_VERIFY_TOKEN=StayJoyVerify2026
    extra_hosts:
      - "app.stayjoy.io.vn:host-gateway"
    depends_on:
      - chatwoot-postgres
      - redis
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    restart: unless-stopped

  # --- Chatwoot PostgreSQL ---
  chatwoot-postgres:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_USER=chatwoot
      - POSTGRES_PASSWORD=chatwoot
      - POSTGRES_DB=chatwoot_production
    volumes:
      - chatwoot_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  # --- Redis (used by Chatwoot) ---
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  chatwoot_pg_data:
  redis_data:
